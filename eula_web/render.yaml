services:
  - type: web
    name: eula
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EULA_TOKEN
        sync: false
      - key: EULA_AGENTE_TOKEN
        sync: false
