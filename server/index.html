<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Eula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0d12;
    --bg-panel:#10141b;
    --bg-panel-2:#161b24;
    --bg-bubble-user:#1c2430;
    --border:#232a35;
    --text-primary:#e9edf3;
    --text-dim:#7c8797;
    --text-faint:#4d5563;
    --cyan:#35e0c8;
    --violet:#a06bff;
    --amber:#ffb454;
    --danger:#ff6b6b;
    --font-display:'Orbitron', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:var(--font-body);
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- Layout general ---------- */
  #app{ display:flex; height:100vh; width:100vw; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:270px; flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition:transform .25s ease;
  }
  #sidebar.oculta{ transform:translateX(-100%); position:absolute; height:100%; z-index:20; }
  .marca{
    display:flex; align-items:center; gap:10px;
    padding:18px 16px 14px;
    font-family:var(--font-display); font-weight:700; letter-spacing:.08em;
    font-size:15px; color:var(--text-primary);
  }
  .marca .punto{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
  #btn-nuevo-chat{
    margin:0 14px 12px; padding:10px 14px;
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:10px;
    color:var(--text-primary); font-family:var(--font-body); font-weight:500; font-size:13.5px;
    cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left;
    transition:border-color .15s, background .15s;
  }
  #btn-nuevo-chat:hover{ border-color:var(--cyan); background:#182029; }
  #lista-chats{ flex:1; overflow-y:auto; padding:4px 10px; }
  .item-chat{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:8px; margin-bottom:2px;
    cursor:pointer; font-size:13px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:relative;
  }
  .item-chat:hover{ background:var(--bg-panel-2); color:var(--text-primary); }
  .item-chat.activo{ background:var(--bg-panel-2); color:var(--text-primary); box-shadow:inset 2px 0 0 var(--cyan); }
  .item-chat .titulo{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .item-chat .borrar{
    opacity:0; flex-shrink:0; width:20px; height:20px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:15px;
  }
  .item-chat:hover .borrar{ opacity:1; }
  .item-chat .borrar:hover{ color:var(--danger); background:#241318; }
  #pie-sidebar{
    padding:12px 16px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
    border-top:1px solid var(--border); display:flex; align-items:center; gap:6px;
  }
  #pie-sidebar .led{ width:6px; height:6px; border-radius:50%; background:var(--cyan); }
  #pie-sidebar .led.off{ background:var(--text-faint); box-shadow:none; }
  #pie-sidebar .led{ box-shadow:0 0 6px var(--cyan); }

  /* ---------- Zona principal ---------- */
  #principal{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  #barra-superior{
    height:52px; flex-shrink:0; display:flex; align-items:center; gap:12px;
    padding:0 18px; border-bottom:1px solid var(--border);
  }
  #btn-menu{ display:none; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  #titulo-chat{ font-size:13.5px; color:var(--text-dim); font-weight:500; }

  #mensajes{ flex:1; overflow-y:auto; padding:24px 0 12px; }
  #mensajes-inner{ max-width:720px; margin:0 auto; padding:0 20px; display:flex; flex-direction:column; gap:18px; }

  .bienvenida{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; gap:18px; color:var(--text-dim);
  }
  .bienvenida h1{ font-family:var(--font-display); font-weight:500; font-size:22px; color:var(--text-primary); letter-spacing:.04em; margin:0;}
  .bienvenida p{ margin:0; font-size:13.5px; max-width:320px; }

  .fila-msj{ display:flex; gap:10px; align-items:flex-start; }
  .fila-msj.usuario{ justify-content:flex-end; }
  .avatar-mini{ width:26px; height:26px; flex-shrink:0; margin-top:2px; }
  .burbuja{
    max-width:74%; padding:11px 14px; border-radius:14px; font-size:14.5px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .fila-msj.usuario .burbuja{ background:var(--bg-bubble-user); border-bottom-right-radius:4px; }
  .fila-msj.eula .burbuja{ background:transparent; padding:11px 0; border-radius:0; }
  .adjunto-mini{
    display:inline-flex; align-items:center; gap:6px; margin-top:6px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
    background:var(--bg-panel-2); border:1px solid var(--border); padding:4px 8px; border-radius:6px;
  }
  .escribiendo{ display:flex; gap:4px; padding:11px 0; }
  .escribiendo span{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:parpadeo 1.2s infinite ease-in-out; }
  .escribiendo span:nth-child(2){ animation-delay:.2s; }
  .escribiendo span:nth-child(3){ animation-delay:.4s; }
  @keyframes parpadeo{ 0%,80%,100%{ opacity:.25; transform:scale(.8);} 40%{ opacity:1; transform:scale(1);} }

  /* ---------- Zona de entrada ---------- */
  #zona-entrada{ padding:10px 20px 20px; }
  #adjuntos-preview{ max-width:720px; margin:0 auto 8px; display:flex; gap:8px; flex-wrap:wrap; padding:0 20px; }
  .chip-adjunto{
    display:flex; align-items:center; gap:6px; background:var(--bg-panel-2); border:1px solid var(--border);
    padding:5px 9px; border-radius:8px; font-size:11.5px; font-family:var(--font-mono); color:var(--text-dim);
  }
  .chip-adjunto .quitar{ cursor:pointer; color:var(--text-faint); }
  .chip-adjunto .quitar:hover{ color:var(--danger); }

  #caja-entrada{
    max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:16px; padding:8px 8px 8px 14px;
  }
  #caja-entrada:focus-within{ border-color:var(--cyan); }
  #texto-entrada{
    flex:1; background:none; border:none; outline:none; resize:none;
    color:var(--text-primary); font-family:var(--font-body); font-size:14.5px; line-height:1.5;
    max-height:160px; padding:6px 0;
  }
  #texto-entrada::placeholder{ color:var(--text-faint); }
  .btn-icono{
    width:34px; height:34px; border-radius:10px; border:none; background:none; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:background .15s, color .15s;
  }
  .btn-icono:hover{ background:var(--bg-panel-2); color:var(--text-primary); }
  #btn-enviar{ background:var(--cyan); color:#04211d; }
  #btn-enviar:hover{ background:#4beedc; }
  #btn-enviar:disabled{ background:var(--bg-panel-2); color:var(--text-faint); cursor:default; }
  #btn-mic.activo{ color:var(--violet); }

  /* ---------- Esfera (avatar mini) ---------- */
  .esfera-svg{ display:block; width:100%; height:100%; }

  /* ---------- Modo voz pantalla completa ---------- */
  #modo-voz{
    position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #0d1219 0%, #06080b 100%);
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index:50;
  }
  #modo-voz.visible{ display:flex; }
  #orbe-grande-wrap{ width:min(60vw, 320px); height:min(60vw, 320px); position:relative; }
  #estado-voz{
    margin-top:26px; font-family:var(--font-mono); font-size:12.5px; letter-spacing:.08em;
    color:var(--text-dim); text-transform:uppercase;
  }
  #transcripcion-voz{
    margin-top:14px; max-width:560px; text-align:center; padding:0 24px;
    font-size:15.5px; color:var(--text-primary); min-height:1.6em;
  }
  #btn-salir-voz{
    position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%;
    background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text-dim);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #btn-salir-voz:hover{ color:var(--text-primary); border-color:var(--cyan); }

  /* ---------- Responsive ---------- */
  @media (max-width: 760px){
    #sidebar{ position:absolute; height:100%; z-index:20; transform:translateX(-100%); }
    #sidebar.visible{ transform:translateX(0); }
    #btn-menu{ display:flex; align-items:center; justify-content:center; }
    .burbuja{ max-width:88%; }
  }
</style>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="marca"><span class="punto"></span> EULA</div>
    <button id="btn-nuevo-chat">＋ Nuevo chat</button>
    <div id="lista-chats"></div>
    <div id="pie-sidebar"><span class="led" id="led-estado"></span> <span id="texto-led">agente: verificando…</span></div>
  </aside>

  <main id="principal">
    <div id="barra-superior">
      <button id="btn-menu">☰</button>
      <div id="titulo-chat">Nuevo chat</div>
    </div>

    <div id="mensajes"><div id="mensajes-inner"></div></div>

    <div id="zona-entrada">
      <div id="adjuntos-preview"></div>
      <div id="caja-entrada">
        <button class="btn-icono" id="btn-adjuntar" title="Adjuntar archivo">📎</button>
        <input type="file" id="input-archivo" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain" multiple hidden>
        <textarea id="texto-entrada" placeholder="Escríbele a Eula…" rows="1"></textarea>
        <button class="btn-icono" id="btn-mic" title="Modo voz">🎙️</button>
        <button class="btn-icono" id="btn-enviar" title="Enviar">➤</button>
      </div>
    </div>
  </main>

  <div id="modo-voz">
    <button id="btn-salir-voz">✕</button>
    <div id="orbe-grande-wrap"></div>
    <div id="estado-voz">Toca la esfera para hablar</div>
    <div id="transcripcion-voz"></div>
  </div>

</div>

<script>
/* ======================================================
   CONFIGURACIÓN Y ESTADO
====================================================== */
const params = new URLSearchParams(location.search);
let TOKEN = params.get('token') || sessionStorage.getItem('eula_token') || '';
if (params.get('token')) sessionStorage.setItem('eula_token', TOKEN);

let chatActualId = localStorage.getItem('eula_ultimo_chat') || null;
let ws = null;
let chats = [];
let vozFemenina = null;
let reconociendo = false;
let recognition = null;

const $ = (sel) => document.querySelector(sel);
const elMensajesInner = $('#mensajes-inner');
const elListaChats = $('#lista-chats');
const elTituloChat = $('#titulo-chat');
const elTextoEntrada = $('#texto-entrada');
const elAdjuntosPreview = $('#adjuntos-preview');
let adjuntosPendientes = []; // [{nombre, mime, datos(base64)}]

if (!TOKEN) {
  document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:#7c8797;font-family:Inter,sans-serif;text-align:center;padding:20px;">Falta el token de acceso.<br>Abre la página como: /?token=TU_TOKEN</div>';
  throw new Error('Sin token');
}

/* ======================================================
   ESFERA (SVG reutilizable) — avatar mini y orbe grande
====================================================== */
function svgEsfera(id, tam){
  return `
  <svg class="esfera-svg" id="${id}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="grad-${id}" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.95"/>
        <stop offset="55%" stop-color="var(--violet)" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#0a0d12" stop-opacity="0"/>
      </radialGradient>
      <filter id="blur-${id}"><feGaussianBlur stdDeviation="3.2"/></filter>
    </defs>
    <circle cx="50" cy="50" r="34" fill="url(#grad-${id})" filter="url(#blur-${id})" class="nucleo-${id}"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="var(--cyan)" stroke-opacity="0.5" stroke-width="0.6" class="anillo-a-${id}"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="var(--violet)" stroke-opacity="0.4" stroke-width="0.5" class="anillo-b-${id}"/>
  </svg>`;
}
$('#orbe-grande-wrap').innerHTML = svgEsfera('orbe-grande', 320);

function estilizarOrbe(id, estado){
  // estado: 'reposo' | 'escuchando' | 'pensando' | 'hablando'
  const nucleo = document.querySelector(`.nucleo-${id}`);
  const anilloA = document.querySelector(`.anillo-a-${id}`);
  const anilloB = document.querySelector(`.anillo-b-${id}`);
  if (!nucleo) return;
  nucleo.style.transition = 'r .4s ease';
  anilloA.style.transition = 'transform 3s linear';
  anilloB.style.transition = 'transform 4s linear';
  const svg = document.getElementById(id);
  svg.style.filter = '';
  if (estado === 'escuchando'){
    svg.style.setProperty('--cyan','#a06bff');
    nucleo.setAttribute('r','38');
  } else if (estado === 'pensando'){
    nucleo.setAttribute('r','30');
    anilloA.style.transform = 'rotate(360deg)';
  } else if (estado === 'hablando'){
    nucleo.setAttribute('r','36');
  } else {
    nucleo.setAttribute('r','34');
  }
}

/* Animación ambiental continua (respiración + rotación de anillos) */
function iniciarAnimacionAmbiental(id){
  let t = 0;
  function paso(){
    t += 0.01;
    const nucleo = document.querySelector(`.nucleo-${id}`);
    const anilloA = document.querySelector(`.anillo-a-${id}`);
    const anilloB = document.querySelector(`.anillo-b-${id}`);
    if (nucleo){
      const base = parseFloat(nucleo.dataset.base || '34');
      nucleo.setAttribute('r', (base + Math.sin(t*2)*1.6).toFixed(2));
    }
    if (anilloA) anilloA.style.transform = `rotate(${t*18}deg)`;
    if (anilloB) anilloB.style.transform = `rotate(${-t*12}deg)`;
    requestAnimationFrame(paso);
  }
  paso();
}
document.querySelectorAll('[class*="nucleo-"]').forEach(n => n.dataset.base = n.getAttribute('r'));
iniciarAnimacionAmbiental('orbe-grande');

/* ======================================================
   VOZ: elegir voz femenina fija + síntesis + reconocimiento
====================================================== */
function elegirVozFemenina(){
  const voces = speechSynthesis.getVoices();
  if (!voces.length) return null;
  const es = voces.filter(v => v.lang.toLowerCase().startsWith('es'));
  const candidatas = es.length ? es : voces;
  const preferidas = ['sabina','helena','paulina','lucía','lucia','mónica','monica','elvira','laura',
                       'google español','female','mujer'];
  for (const pref of preferidas){
    const encontrada = candidatas.find(v => v.name.toLowerCase().includes(pref));
    if (encontrada) return encontrada;
  }
  return candidatas[0];
}
speechSynthesis.onvoiceschanged = () => { vozFemenina = elegirVozFemenina(); };
vozFemenina = elegirVozFemenina();

function hablar(texto){
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window) || !texto){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (vozFemenina) u.voice = vozFemenina;
    u.lang = 'es-ES';
    u.rate = 1.03;
    u.pitch = 1.05;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec){
  recognition = new SpeechRec();
  recognition.lang = 'es-ES';
  recognition.interimResults = true;
  recognition.continuous = false;
}

/* ======================================================
   MODO VOZ (pantalla completa)
====================================================== */
const elModoVoz = $('#modo-voz');
const elEstadoVoz = $('#estado-voz');
const elTranscripcionVoz = $('#transcripcion-voz');

function abrirModoVoz(){
  elModoVoz.classList.add('visible');
  estilizarOrbe('orbe-grande','reposo');
  elEstadoVoz.textContent = 'Toca la esfera para hablar';
  elTranscripcionVoz.textContent = '';
  if (!SpeechRec){
    elEstadoVoz.textContent = 'Tu navegador no soporta reconocimiento de voz. Usa Chrome.';
  }
}
function cerrarModoVoz(){
  elModoVoz.classList.remove('visible');
  if (recognition) try{ recognition.stop(); }catch(e){}
  speechSynthesis.cancel();
}
$('#btn-mic').addEventListener('click', abrirModoVoz);
$('#btn-salir-voz').addEventListener('click', cerrarModoVoz);

$('#orbe-grande-wrap').addEventListener('click', () => {
  if (!SpeechRec || reconociendo) return;
  reconociendo = true;
  estilizarOrbe('orbe-grande','escuchando');
  elEstadoVoz.textContent = 'Escuchando…';
  elTranscripcionVoz.textContent = '';

  recognition.onresult = (e) => {
    let texto = '';
    for (const r of e.results) texto += r[0].transcript;
    elTranscripcionVoz.textContent = texto;
  };
  recognition.onerror = () => { reconociendo = false; estilizarOrbe('orbe-grande','reposo'); elEstadoVoz.textContent = 'No te escuché bien, toca para volver a intentar.'; };
  recognition.onend = async () => {
    reconociendo = false;
    const texto = elTranscripcionVoz.textContent.trim();
    if (!texto){ estilizarOrbe('orbe-grande','reposo'); elEstadoVoz.textContent = 'Toca la esfera para hablar'; return; }
    estilizarOrbe('orbe-grande','pensando');
    elEstadoVoz.textContent = 'Pensando…';
    const respuesta = await enviarMensajeYEsperar(texto);
    estilizarOrbe('orbe-grande','hablando');
    elEstadoVoz.textContent = 'Hablando…';
    elTranscripcionVoz.textContent = respuesta || '';
    await hablar(respuesta || '');
    estilizarOrbe('orbe-grande','reposo');
    elEstadoVoz.textContent = 'Toca la esfera para hablar';
  };
  recognition.start();
});

/* ======================================================
   CHATS: listar / crear / borrar / cambiar
====================================================== */
async function apiFetch(ruta, opciones = {}){
  const url = new URL(ruta, location.origin);
  url.searchParams.set('token', TOKEN);
  const resp = await fetch(url, opciones);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.status === 204 ? null : resp.json();
}

async function cargarListaChats(){
  chats = await apiFetch('/api/chats');
  if (!chatActualId || !chats.find(c => c.id === chatActualId)){
    chatActualId = chats[0]?.id || null;
  }
  renderListaChats();
}

function renderListaChats(){
  elListaChats.innerHTML = '';
  for (const chat of chats){
    const div = document.createElement('div');
    div.className = 'item-chat' + (chat.id === chatActualId ? ' activo' : '');
    div.innerHTML = `<span class="titulo">${escaparHtml(chat.titulo)}</span><span class="borrar" title="Borrar chat">✕</span>`;
    div.querySelector('.titulo').addEventListener('click', () => cambiarChat(chat.id));
    div.querySelector('.borrar').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('¿Borrar este chat? No se puede deshacer.')) return;
      await apiFetch(`/api/chats/${chat.id}`, { method:'DELETE' });
      if (chatActualId === chat.id) chatActualId = null;
      await cargarListaChats();
      if (!chatActualId){ await crearNuevoChat(); } else { conectarWebSocket(); }
    });
    elListaChats.appendChild(div);
  }
}

async function crearNuevoChat(){
  const nuevo = await apiFetch('/api/chats', { method:'POST' });
  chatActualId = nuevo.id;
  await cargarListaChats();
  conectarWebSocket();
  elTextoEntrada.focus();
}
$('#btn-nuevo-chat').addEventListener('click', crearNuevoChat);

function cambiarChat(id){
  if (id === chatActualId) return;
  chatActualId = id;
  localStorage.setItem('eula_ultimo_chat', id);
  renderListaChats();
  conectarWebSocket();
  if (window.innerWidth <= 760) $('#sidebar').classList.remove('visible');
}

/* ======================================================
   MENSAJES: render
====================================================== */
function escaparHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function mostrarBienvenida(){
  elMensajesInner.innerHTML = `
    <div class="bienvenida" style="height:60vh;">
      <div style="width:64px;height:64px;">${svgEsfera('orbe-bienvenida')}</div>
      <h1>EULA</h1>
      <p>Escríbele algo o toca el micrófono para hablarle. Puede abrir apps en tu PC y adjuntar archivos.</p>
    </div>`;
  iniciarAnimacionAmbiental('orbe-bienvenida');
}

function agregarBurbuja(rol, texto, adjuntosNombres){
  const vacia = elMensajesInner.querySelector('.bienvenida');
  if (vacia) elMensajesInner.innerHTML = '';
  const fila = document.createElement('div');
  fila.className = `fila-msj ${rol === 'user' ? 'usuario' : 'eula'}`;
  let avatarHtml = '';
  if (rol !== 'user'){
    const idEsfera = 'av-' + Math.random().toString(36).slice(2,8);
    avatarHtml = `<div class="avatar-mini">${svgEsfera(idEsfera)}</div>`;
  }
  const burbuja = document.createElement('div');
  burbuja.className = 'burbuja';
  burbuja.textContent = texto;
  if (adjuntosNombres && adjuntosNombres.length){
    const cont = document.createElement('div');
    for (const n of adjuntosNombres){
      const chip = document.createElement('div');
      chip.className = 'adjunto-mini';
      chip.textContent = '📎 ' + n;
      cont.appendChild(chip);
    }
    burbuja.appendChild(cont);
  }
  fila.innerHTML = avatarHtml;
  fila.appendChild(burbuja);
  elMensajesInner.appendChild(fila);
  if (rol !== 'user') iniciarAnimacionAmbiental(fila.querySelector('.esfera-svg').id);
  $('#mensajes').scrollTop = $('#mensajes').scrollHeight;
  return fila;
}

function mostrarEscribiendo(){
  const fila = document.createElement('div');
  fila.className = 'fila-msj eula';
  fila.id = 'fila-escribiendo';
  const idEsfera = 'av-typing';
  fila.innerHTML = `<div class="avatar-mini">${svgEsfera(idEsfera)}</div><div class="escribiendo"><span></span><span></span><span></span></div>`;
  elMensajesInner.appendChild(fila);
  iniciarAnimacionAmbiental(idEsfera);
  $('#mensajes').scrollTop = $('#mensajes').scrollHeight;
}
function quitarEscribiendo(){ document.getElementById('fila-escribiendo')?.remove(); }

/* ======================================================
   WEBSOCKET
====================================================== */
let resolverRespuestaPendiente = null;

function conectarWebSocket(){
  if (ws) { try{ ws.close(); }catch(e){} }
  elMensajesInner.innerHTML = '';
  const chatInfo = chats.find(c => c.id === chatActualId);
  elTituloChat.textContent = chatInfo?.titulo || 'Nuevo chat';
  mostrarBienvenida();

  const protocolo = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${protocolo}://${location.host}/ws/chat?token=${encodeURIComponent(TOKEN)}&chat_id=${encodeURIComponent(chatActualId)}`;
  ws = new WebSocket(url);

  ws.onmessage = (evento) => {
    quitarEscribiendo();
    let data;
    try { data = JSON.parse(evento.data); } catch(e){ data = { texto: evento.data }; }
    agregarBurbuja('eula', data.texto || '');
    if (data.titulo_nuevo){
      const chat = chats.find(c => c.id === chatActualId);
      if (chat) chat.titulo = data.titulo_nuevo;
      elTituloChat.textContent = data.titulo_nuevo;
      renderListaChats();
    }
    if (resolverRespuestaPendiente){ resolverRespuestaPendiente(data.texto || ''); resolverRespuestaPendiente = null; }
  };
  ws.onerror = () => { quitarEscribiendo(); };
}

function enviarMensajeYEsperar(texto){
  return new Promise((resolve) => {
    resolverRespuestaPendiente = resolve;
    mandarPorWebSocket(texto, []);
  });
}

function mandarPorWebSocket(texto, adjuntos){
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ texto, archivos: adjuntos }));
}

/* ======================================================
   ENVÍO DESDE EL TEXTO
====================================================== */
function autoAjustarAltura(){
  elTextoEntrada.style.height = 'auto';
  elTextoEntrada.style.height = Math.min(elTextoEntrada.scrollHeight, 160) + 'px';
}
elTextoEntrada.addEventListener('input', autoAjustarAltura);
elTextoEntrada.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarDesdeCaja(); }
});
$('#btn-enviar').addEventListener('click', enviarDesdeCaja);

function enviarDesdeCaja(){
  const texto = elTextoEntrada.value.trim();
  if (!texto && adjuntosPendientes.length === 0) return;
  const nombres = adjuntosPendientes.map(a => a.nombre);
  agregarBurbuja('user', texto, nombres);
  mostrarEscribiendo();
  mandarPorWebSocket(texto, adjuntosPendientes);
  adjuntosPendientes = [];
  renderAdjuntosPreview();
  elTextoEntrada.value = '';
  autoAjustarAltura();
}

/* ---------- Adjuntos ---------- */
$('#btn-adjuntar').addEventListener('click', () => $('#input-archivo').click());
$('#input-archivo').addEventListener('change', async (e) => {
  for (const archivo of e.target.files){
    if (archivo.size > 10 * 1024 * 1024){ alert(`${archivo.name} pesa más de 10 MB.`); continue; }
    const datos = await archivoABase64(archivo);
    adjuntosPendientes.push({ nombre: archivo.name, mime: archivo.type, datos });
  }
  e.target.value = '';
  renderAdjuntosPreview();
});
function archivoABase64(archivo){
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result.split(',')[1]);
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}
function renderAdjuntosPreview(){
  elAdjuntosPreview.innerHTML = '';
  adjuntosPendientes.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip-adjunto';
    chip.innerHTML = `📎 ${escaparHtml(a.nombre)} <span class="quitar" data-i="${i}">✕</span>`;
    chip.querySelector('.quitar').addEventListener('click', () => {
      adjuntosPendientes.splice(i, 1);
      renderAdjuntosPreview();
    });
    elAdjuntosPreview.appendChild(chip);
  });
}

/* ---------- Sidebar móvil ---------- */
$('#btn-menu').addEventListener('click', () => $('#sidebar').classList.toggle('visible'));

/* ======================================================
   ESTADO DEL AGENTE LOCAL (informativo, vía primer mensaje del sistema)
   No hay endpoint dedicado; se infiere por si llegan respuestas de
   comandos. Aquí solo se deja un indicador neutro.
====================================================== */
$('#texto-led').textContent = 'servidor conectado';

/* ======================================================
   ARRANQUE
====================================================== */
(async function iniciar(){
  try{
    await cargarListaChats();
    if (!chatActualId){ await crearNuevoChat(); }
    else { conectarWebSocket(); }
  }catch(err){
    elMensajesInner.innerHTML = `<div class="bienvenida"><p style="color:#ff6b6b;">No pude conectar con el servidor (${err.message}). Revisa tu token.</p></div>`;
  }
})();
</script>
